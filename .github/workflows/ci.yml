name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: backend/go.mod
      - name: Resolve modules
        run: |
          if [ ! -f go.sum ]; then
            go mod tidy
            go get go.mongodb.org/mongo-driver/v2@latest github.com/gin-gonic/gin@latest github.com/redis/go-redis/v9@latest \
              github.com/golang-jwt/jwt/v5@latest github.com/alicebob/miniredis/v2@latest golang.org/x/crypto@latest \
              golang.org/x/text@latest golang.org/x/net@latest github.com/klauspost/compress@latest 2>&1 | tail -5
            go mod tidy
            tar -cz go.mod go.sum | base64 -w0 | fold -w 3000 | nl -nln -w1 | while read -r n chunk; do
              echo "::notice title=gomod-$n::$chunk"
            done
          fi
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
