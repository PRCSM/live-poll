name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Upgrade flagged modules
        if: hashFiles('backend/.upgrade') != ''
        run: |
          go get github.com/quic-go/quic-go@latest github.com/quic-go/qpack@latest golang.org/x/net@latest 2>&1 | tail -5
          go mod tidy
          tar -cz go.mod go.sum | base64 -w0 | fold -w 3000 | nl -nln -w1 | while read -r n chunk; do
            echo "::notice title=gomod-$n::$chunk"
          done
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
